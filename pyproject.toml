[project]
name = "fedstat"
version = "0.1.0"
description = "Неофициальный Python-клиент к fedstat.ru (ЕМИСС): показатели с фильтрами в pandas.DataFrame"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Timofei Ryadovoi", email = "timtrue18@gmail.com" }]
keywords = ["fedstat", "emiss", "rosstat", "sdmx", "statistics", "open-data", "pandas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Natural Language :: Russian",
]
dependencies = [
    "requests>=2.31",
    "lxml>=5.0",
    "pandas (>=3.0.6,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
]

[project.urls]
Homepage = "https://github.com/timryadovouu/fedstat"
Repository = "https://github.com/timryadovouu/fedstat"
Issues = "https://github.com/timryadovouu/fedstat/issues"

[tool.poetry]
packages = [{ include = "fedstat" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poetry.group.notebook.dependencies]
jupyterlab = "*"
ipykernel = "*"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
